name: Reveal participants

on:
  schedule:
    - cron: '45 13 30 9 *'
      timezone: 'Europe/Paris'

    - cron: '45 13 2 10 *'
      timezone: 'Europe/Paris'

  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  reveal:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Determiner la fiche a publier
        id: participant
        run: |
          TODAY=$(TZ=Europe/Paris date +%Y-%m-%d)

          case "$TODAY" in
            "2026-09-30")
              echo "file=RockinsaneTTV.md" >> "$GITHUB_OUTPUT"
              echo "title=RockinsaneTTV" >> "$GITHUB_OUTPUT"
              ;;

            "2026-10-02")
              echo "file=Raven.md" >> "$GITHUB_OUTPUT"
              echo "title=xr4ven_tv" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "file=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publier la fiche
        if: steps.participant.outputs.file != ''
        env:
          FILE: ${{ steps.participant.outputs.file }}
          TITLE: ${{ steps.participant.outputs.title }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["FILE"])
          title = os.environ["TITLE"]

          text = path.read_text(encoding="utf-8")

          text = text.replace("published: false", "published: true")
          text = text.replace("nav_exclude: true\n", "")
          text = text.replace("search_exclude: true\n", "")

          if "parent: Participants" not in text:
              text = text.replace(
                  f"title: {title}\n",
                  f"title: {title}\nparent: Participants\n"
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Enregistrer la publication
        if: steps.participant.outputs.file != ''
        env:
          FILE: ${{ steps.participant.outputs.file }}
          TITLE: ${{ steps.participant.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"

          if git diff --cached --quiet; then
            echo "La fiche est deja publiee."
          else
            git commit -m "Reveal $TITLE"
            git push
          fi

      - name: Reconstruire GitHub Pages
        if: steps.participant.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/pages/builds
