name: Reveal Jelyla

on:
  schedule:
    - cron: '45 13 21 9 *'
      timezone: 'Europe/Paris'

  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  reveal:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Publier la fiche de Jelyla
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Jelyla.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace("published: false", "published: true")
          text = text.replace("nav_exclude: true\n", "")
          text = text.replace("search_exclude: true\n", "")

          if "parent: Participants" not in text:
              text = text.replace(
                  "title: Jelyla\n",
                  "title: Jelyla\nparent: Participants\n"
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Enregistrer la publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Jelyla.md

          if git diff --cached --quiet; then
            echo "La fiche est deja publiee."
          else
            git commit -m "Reveal Jelyla"
            git push
          fi

      - name: Reconstruire GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/pages/builds
